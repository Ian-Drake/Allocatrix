openapi: 3.0.0
info:
  title: Model Portfolio Account Manager - Portfolio API
  version: 1.0.0
  description: Portfolio management endpoints for creating, editing, and validating model portfolios
servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://allocatrix.app/api
    description: Production server
paths:
  /portfolios:
    get:
      summary: List all portfolios
      description: Retrieve all model portfolios (Draft, Valid, Locked)
      tags:
        - Portfolios
      operationId: listPortfolios
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Draft, Valid, Locked]
          description: Filter by portfolio status
      responses:
        '200':
          description: List of portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelPortfolio'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    post:
      summary: Create new portfolio
      description: Create a new Draft model portfolio
      tags:
        - Portfolios
      operationId: createPortfolio
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "60/40 Growth Portfolio"
                description:
                  type: string
                  maxLength: 1000
                  example: "60% equities, 40% bonds allocation"
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Portfolio with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /portfolios/{portfolioId}:
    get:
      summary: Get portfolio details
      description: Retrieve a specific portfolio with all asset classes and tickers
      tags:
        - Portfolios
      operationId: getPortfolio
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Portfolio details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolioDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
    put:
      summary: Update portfolio
      description: Update Draft portfolio name/description. Cannot edit if Valid/Locked.
      tags:
        - Portfolios
      operationId: updatePortfolio
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Portfolio updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot edit locked portfolio. Clone it instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Portfolio name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Delete portfolio
      description: Delete Draft portfolio only. Cannot delete if assigned to accounts.
      tags:
        - Portfolios
      operationId: deletePortfolio
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Portfolio deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot delete portfolio (assigned to account or not Draft state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /portfolios/{portfolioId}/clone:
    post:
      summary: Clone portfolio
      description: Clone a Valid/Locked portfolio into new Draft copy with same structure
      tags:
        - Portfolios
      operationId: clonePortfolio
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newName
              properties:
                newName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: "60/40 Growth Portfolio - Modified"
      responses:
        '201':
          description: Portfolio cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Clone name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /portfolios/{portfolioId}/validate:
    post:
      summary: Validate and transition portfolio to Valid
      description: Validate that all weights sum to 100% ±1%. If valid, transition to Valid state.
      tags:
        - Portfolios
      operationId: validatePortfolio
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Portfolio is valid and transitioned to Valid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolio'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - validationErrors
                properties:
                  code:
                    type: string
                    example: "VALIDATION_FAILED"
                  message:
                    type: string
                    example: "Portfolio weights do not sum to 100%"
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: "assetClassWeights"
                        error:
                          type: string
                          example: "Sum is 98.5%, expected 100% ±1%"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only Draft portfolios can be validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /portfolios/{portfolioId}/asset-classes:
    post:
      summary: Add asset class to portfolio
      description: Add an asset class with target weight to a Draft portfolio
      tags:
        - Portfolios
      operationId: addAssetClass
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetClassId
                - targetWeightPct
              properties:
                assetClassId:
                  type: string
                  format: uuid
                  description: Reference to existing asset class
                targetWeightPct:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 100
                  example: 60.00
      responses:
        '201':
          description: Asset class added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPortfolioAssetClass'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot edit non-Draft portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Portfolio or asset class not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Asset class already exists in this portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Remove asset class from portfolio
      description: Remove an asset class from a Draft portfolio
      tags:
        - Portfolios
      operationId: removeAssetClass
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assetClassId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asset class removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot edit non-Draft portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /portfolios/{portfolioId}/tickers:
    post:
      summary: Add ticker to asset class
      description: Add a ticker allocation within an asset class
      tags:
        - Portfolios
      operationId: addTicker
      security:
        - sessionCookie: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetClassId
                - symbol
                - targetWeightPctWithinAssetClass
              properties:
                assetClassId:
                  type: string
                  format: uuid
                symbol:
                  type: string
                  pattern: "^[A-Z0-9\\.\\-]{1,10}$"
                  example: "AAPL"
                displayName:
                  type: string
                  example: "Apple Inc."
                targetWeightPctWithinAssetClass:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 100
                  example: 50.00
      responses:
        '201':
          description: Ticker added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerAllocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot edit non-Draft portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Portfolio or asset class not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ticker already exists in this asset class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ModelPortfolio:
      type: object
      required:
        - id
        - name
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "60/40 Growth Portfolio"
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [Draft, Valid, Locked]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        clonedFromModelId:
          type: string
          format: uuid
          nullable: true
    
    ModelPortfolioDetail:
      allOf:
        - $ref: '#/components/schemas/ModelPortfolio'
        - type: object
          properties:
            assetClasses:
              type: array
              items:
                $ref: '#/components/schemas/ModelPortfolioAssetClassDetail'
    
    ModelPortfolioAssetClass:
      type: object
      required:
        - id
        - modelPortfolioId
        - assetClassId
        - assetClassName
        - targetWeightPct
      properties:
        id:
          type: string
          format: uuid
        modelPortfolioId:
          type: string
          format: uuid
        assetClassId:
          type: string
          format: uuid
        assetClassName:
          type: string
        targetWeightPct:
          type: number
          format: double
          example: 60.00
    
    ModelPortfolioAssetClassDetail:
      allOf:
        - $ref: '#/components/schemas/ModelPortfolioAssetClass'
        - type: object
          properties:
            tickers:
              type: array
              items:
                $ref: '#/components/schemas/TickerAllocation'
    
    TickerAllocation:
      type: object
      required:
        - id
        - assetClassId
        - symbol
        - targetWeightPctWithinAssetClass
      properties:
        id:
          type: string
          format: uuid
        assetClassId:
          type: string
          format: uuid
        symbol:
          type: string
          example: "AAPL"
        displayName:
          type: string
          nullable: true
          example: "Apple Inc."
        targetWeightPctWithinAssetClass:
          type: number
          format: double
          example: 50.00
    
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context
  
  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Unauthorized:
      description: Not authenticated or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

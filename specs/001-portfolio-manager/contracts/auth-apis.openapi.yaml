openapi: 3.0.0
info:
  title: Model Portfolio Account Manager - Authentication API
  version: 1.0.0
  description: Schwab OAuth 2.0 authentication and token management endpoints
servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://allocatrix.app/api
    description: Production server
paths:
  /auth/oauth-start:
    get:
      summary: Initiate Schwab OAuth flow
      description: Redirect user to Schwab's OAuth consent screen. Returns redirect URL.
      tags:
        - Authentication
      operationId: startOAuthFlow
      responses:
        '302':
          description: Redirect to Schwab OAuth endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Schwab OAuth authorization URL
        '500':
          description: Failed to generate OAuth URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/oauth-callback:
    get:
      summary: Handle Schwab OAuth callback
      description: Exchange authorization code for access and refresh tokens. Sets HTTP-only session cookie.
      tags:
        - Authentication
      operationId: handleOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            description: Authorization code from Schwab
        - name: state
          in: query
          required: true
          schema:
            type: string
            description: State parameter for CSRF protection
      responses:
        '302':
          description: Successful authentication, redirect to dashboard
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HTTP-only session cookie (auth_session)
        '400':
          description: Invalid authorization code or state mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: State parameter invalid (CSRF attack suspected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to exchange code for tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/status:
    get:
      summary: Get current authentication status
      description: Verify if user is authenticated and token is valid
      tags:
        - Authentication
      operationId: getAuthStatus
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User is authenticated
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                  - tokenExpiresAt
                properties:
                  authenticated:
                    type: boolean
                    example: true
                  tokenExpiresAt:
                    type: string
                    format: date-time
                    example: "2025-11-16T15:00:00Z"
                  refreshTokenExpiresAt:
                    type: string
                    format: date-time
                    example: "2025-11-23T12:00:00Z"
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                properties:
                  authenticated:
                    type: boolean
                    example: false
  
  /auth/refresh-token:
    post:
      summary: Manually refresh access token
      description: Force refresh of access token (normally automatic). Returns new token.
      tags:
        - Authentication
      operationId: refreshToken
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - expiresAt
                properties:
                  accessToken:
                    type: string
                    description: New access token (for frontend awareness only; HTTP-only cookie holds it)
                    example: "eyJhbGc..."
                  expiresAt:
                    type: string
                    format: date-time
                    example: "2025-11-16T15:00:00Z"
        '401':
          description: Session expired or refresh token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to refresh token with Schwab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/logout:
    post:
      summary: Log out user
      description: Clear session cookie and revoke tokens (optional - Schwab may not support revocation)
      tags:
        - Authentication
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code (e.g., INVALID_STATE, TOKEN_EXPIRED)
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context (optional)
    
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: auth_session
      description: HTTP-only session cookie set after OAuth callback
